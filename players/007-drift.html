<!doctype html><meta charset=utf-8><title>007 · drift</title>
<style>html{height:100%;background:#0b0b10;color:#99a;font:13px monospace;cursor:pointer}body{margin:0;height:100%;display:grid;place-items:center;align-content:center}pre{margin:0;line-height:1.6}i{color:#ff7;font-style:normal}</style>
<pre id=g>click to start · drop a sound · then leave it alone</pre>
<script>
// A loop that rewrites itself. 8 steps, each a gene: [slice, rate, reverse, gain]. Each bar one gene mutates; filter + echo random-walk.
const A=new AudioContext(),R=A.sampleRate,N=(t,...a)=>a.reduce((n,b)=>(n.connect(b),b),t),rnd=a=>a[Math.random()*a.length|0];
let buf=A.createBuffer(1,R*2,R),rev,on=0,step=0,next=0,bar=0,cut=.8,echo=.2;
{const d=buf.getChannelData(0),n=[220,262,330,392,330,262,196,247];for(let i=0;i<d.length;i++){const t=i/R,s=t%.25,k=t%.5;
d[i]=.3*Math.sin(6.283*n[t*4|0]*t)*Math.exp(-9*s)+.5*Math.sin(6.283*(50*k+3*(1-Math.exp(-40*k))))*Math.exp(-8*k)}}
const ir=A.createBuffer(2,R*4,R);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)**3}
const lp=A.createBiquadFilter(),dl=A.createDelay(2),fb=A.createGain(),ds=A.createGain(),rv=A.createConvolver(),rs=A.createGain();rv.buffer=ir;rs.gain.value=.35;fb.gain.value=.55;
N(lp,A.destination);N(lp,ds,dl,fb,dl,A.destination);N(lp,rs,rv,A.destination);
const reverse=b=>{const r=A.createBuffer(b.numberOfChannels,b.length,b.sampleRate);for(let c=0;c<b.numberOfChannels;c++)r.getChannelData(c).set(b.getChannelData(c).slice().reverse());return r};rev=reverse(buf);
let genes=[...Array(8)].map((_,i)=>[i,1,0,1]);const RATES=[.5,1,1,1,1.5,2];
function mutate(){const g=genes[Math.random()*8|0],k=Math.random()*4|0;g[k]=[()=>Math.random()*8|0,()=>rnd(RATES),()=>+(Math.random()<.25),()=>rnd([0,.6,1,1])][k]();
cut=Math.min(1,Math.max(.25,cut+(Math.random()-.5)*.15));echo=Math.min(.8,Math.max(0,echo+(Math.random()-.5)*.2));if(Math.random()<.05)genes=genes.map((_,i)=>[i,1,0,1])}
function tick(){const sl=buf.duration/8;while(on&&next<A.currentTime+.12){if(step%8==0){if(bar++)mutate();const t=next;lp.frequency.setTargetAtTime(20000*.01**(1-cut),t,.5);ds.gain.setTargetAtTime(echo,t,.5);draw()}
const [s,r,b,v]=genes[step%8];if(v){const x=A.createBufferSource(),g=A.createGain();x.buffer=b?rev:buf;x.playbackRate.value=r;g.gain.value=v;
g.gain.setTargetAtTime(0,next+sl*.92,.006);N(x,g,lp);x.start(next,b?buf.duration-(s+1)*sl:s*sl,sl*r+.03)}next+=sl;step++}}
function draw(){g.innerHTML='bar '+bar+'  filter '+(cut*100|0)+'%  echo '+(echo*100|0)+'%\n\n'+genes.map((x,i)=>(i==step%8?'<i>':'')+'slice '+x[0]+'  ×'+x[1]+(x[2]?'  ◀':'  ▶')+'  '+'▮'.repeat(x[3]*4|0)+(i==step%8?'</i>':'')).join('\n')}
setInterval(tick,25);
onclick=()=>{A.resume();on^=1;next=A.currentTime+.05;if(!on)g.textContent='paused · click to continue'};
async function load(f){const b=await f.arrayBuffer();try{buf=await A.decodeAudioData(b.slice(0))}catch(e){buf=aiff(b)}rev=reverse(buf);A.resume();if(!on){on=1;next=A.currentTime+.05}}
function aiff(b){const v=new DataView(b);let p=12,c,n,w,r,o;while(p+8<=v.byteLength){const id=String.fromCharCode(...new Uint8Array(b,p,4)),z=v.getUint32(p+4);
if(id=="COMM"){c=v.getInt16(p+8);n=v.getUint32(p+10);w=v.getInt16(p+14)/8;r=v.getUint32(p+18)*2**((v.getUint16(p+16)&32767)-16414)}if(id=="SSND")o=p+16+v.getUint32(p+8);p+=8+z+(z&1)}
const B=A.createBuffer(c,n,r);for(let k=0;k<c;k++){const d=B.getChannelData(k);for(let i=0;i<n;i++){const q=o+(i*c+k)*w;d[i]=w==1?v.getInt8(q)/128:w==2?v.getInt16(q)/32768:w==3?(v.getInt8(q)*65536+v.getUint16(q+1))/8388608:v.getInt32(q)/2147483648}}return B}
ondragover=e=>e.preventDefault();ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
</script>
