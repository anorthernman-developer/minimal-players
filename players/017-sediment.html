<!doctype html><meta charset=utf-8><title>017 · sediment</title>
<style>html{height:100%;background:#0b0a09;color:#887;font:13px monospace;cursor:ns-resize;user-select:none}body{margin:0;height:100%;display:grid;place-items:center}p{margin:0;text-align:center;line-height:2}b{color:#ec9;font-weight:400}</style>
<p id=m>click to play · move down to sink · space keeps what you hear · backspace undo · drop a sound</p>
<script>
// Sediment: the loop sinks through four speeds (×1 dry, ×½ grit, ×¼ echo, ×⅛ room). Space prints the layer you're hearing,
// one loop long, offline with its tails folded back in, and that becomes the new loop. Slow layers settle into new material.
const A=new AudioContext(),R=A.sampleRate,$=document.getElementById('m'),out=A.createDynamicsCompressor();out.connect(A.destination);
const SP=[1,.5,.25,.125],NM=['×1 dry','×½ grit','×¼ echo','×⅛ room'];let buf=A.createBuffer(1,R*2,R),hist=[],on=0,t0=0,y=0,L=[],G=[];
{const d=buf.getChannelData(0),n=[220,262,330,392,330,262,196,247];for(let i=0;i<d.length;i++){const t=i/R,s=t%.25,k=t%.5;
d[i]=.3*Math.sin(6.283*n[t*4|0]*t)*Math.exp(-9*s)+.5*Math.sin(6.283*(50*k+3*(1-Math.exp(-40*k))))*Math.exp(-8*k)+.04*(Math.random()-.5)*Math.exp(-30*(t%.125))}}
const ir=A.createBuffer(2,R*4,R);for(let k=0;k<2;k++){const d=ir.getChannelData(k);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)**3}
// one effect per layer (principle 17), built the same way live and offline
function layer(c,i,o,dur){const g=c.createGain(),f=(t,v)=>Object.assign(c.createBiquadFilter(),{type:t}),n=[g];if(i==1){const w=c.createWaveShaper(),l=f('lowpass');
w.curve=Float32Array.from({length:1024},(_,j)=>Math.tanh(4*(j/511.5-1)));l.frequency.value=1500;g.connect(w);w.connect(l);l.connect(o)}else if(i==2){const d=c.createDelay(4),fb=c.createGain(),l=f('lowpass');
d.delayTime.value=Math.min(3.9,dur*.75);fb.gain.value=.5;l.frequency.value=1000;g.connect(o);g.connect(l);l.connect(d);d.connect(fb);fb.connect(l);d.connect(o)}else if(i==3){const v=c.createConvolver(),k=c.createGain();
v.buffer=ir;k.gain.value=1.4;g.connect(v);v.connect(k);k.connect(o)}else g.connect(o);return g}
const lev=i=>Math.max(0,1-Math.abs(y*3-i));
function start(){L.forEach(s=>s.stop());G.forEach(g=>g.disconnect());t0=A.currentTime+.05;G=SP.map((s,i)=>layer(A,i,out,buf.duration));
L=SP.map((s,i)=>{const b=A.createBufferSource();b.buffer=buf;b.loop=true;b.playbackRate.value=s;b.connect(G[i]);b.start(t0);return b});mix();show()}
function mix(){G.forEach((g,i)=>g.gain.setTargetAtTime(lev(i)*.8,A.currentTime,.06))}
function show(t){const i=Math.round(y*3);$.innerHTML=t||(on?'<b>'+NM[i]+'</b> · sediment '+hist.length+'<br>space keeps it · backspace undo':'click to play')}
// print: the part of the layer playing now, one loop long, tails folded onto the start, normalised
async function print(){if(!on)return;const i=Math.round(y*3),r=SP[i],D=buf.duration,seg=Math.max(0,Math.floor((A.currentTime-t0)/D))%(1/r),N=buf.length,O=new OfflineAudioContext(2,N+R*4,buf.sampleRate);
show('settling…');const s=O.createBufferSource();s.buffer=buf;s.loop=true;s.playbackRate.value=r;s.connect(layer(O,i,O.destination,D));s.start(0,seg*D*r);
const q=await O.startRendering(),b=A.createBuffer(2,N,buf.sampleRate);let pk=1e-9;for(let c=0;c<2;c++){const d=b.getChannelData(c),e=q.getChannelData(c);
for(let j=0;j<e.length;j++)d[j%N]+=e[j];d.forEach(v=>pk=Math.max(pk,Math.abs(v)))}for(let c=0;c<2;c++)b.getChannelData(c).forEach((v,j,d)=>d[j]=v*.9/pk);
hist.push(buf);buf=b;start()}
show();
onclick=()=>{A.resume();on^=1;if(on)start();else{L.forEach(s=>s.stop());L=[];show()}};
onpointermove=e=>{y=e.clientY/innerHeight;if(on){mix();show()}};
onkeydown=e=>{if(e.repeat)return;if(e.code=='Space'){e.preventDefault();print()}if(e.code=='Backspace'&&hist.length){buf=hist.pop();if(on)start()}};
async function load(F){const b=await F.arrayBuffer();try{buf=await A.decodeAudioData(b.slice(0))}catch(e){buf=aiff(b)}hist=[];A.resume();on=1;start()}
function aiff(b){const v=new DataView(b);let p=12,c,n,w,r,o;while(p+8<=v.byteLength){const id=String.fromCharCode(...new Uint8Array(b,p,4)),z=v.getUint32(p+4);
if(id=="COMM"){c=v.getInt16(p+8);n=v.getUint32(p+10);w=v.getInt16(p+14)/8;r=v.getUint32(p+18)*2**((v.getUint16(p+16)&32767)-16414)}if(id=="SSND")o=p+16+v.getUint32(p+8);p+=8+z+(z&1)}
const B=A.createBuffer(c,n,r);for(let k=0;k<c;k++){const d=B.getChannelData(k);for(let i=0;i<n;i++){const q=o+(i*c+k)*w;d[i]=w==1?v.getInt8(q)/128:w==2?v.getInt16(q)/32768:w==3?(v.getInt8(q)*65536+v.getUint16(q+1))/8388608:v.getInt32(q)/2147483648}}return B}
ondragover=e=>e.preventDefault();ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
</script>
