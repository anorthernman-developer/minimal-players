<!doctype html><meta charset=utf-8><title>005 · keys</title>
<style>html{height:100%;background:#000;color:#0f6;font:15px monospace}body{margin:0;height:100%;display:grid;place-items:center;align-content:center;gap:4px}pre{margin:0}#s{font-size:22px}</style>
<pre id=s>space to play</pre><pre style=color:#064>
space  play/stop     enter  pick a sound (or drop one)
1-6    loop length   whole ½ ¼ ⅛ 1/16 1/32  (beat repeat)
q-p    loop start    0/10 … 9/10 of the sample
a-l    pitch         -12 -7 -5 -2 0 +3 +5 +7 +12
z-m    colour        dry  low  high  echo  room  crush  all</pre><input type=file id=f accept="audio/*,.aif,.aiff" hidden>
<script>
// Keyboard only: every row of the keyboard is one dimension of the loop. The state is one line of text.
const A=new AudioContext(),R=A.sampleRate,N=(t,...a)=>a.reduce((n,b)=>(n.connect(b),b),t);
let buf=A.createBuffer(1,R*2,R),src,on=0,len=0,pos=0,pit=0,fx='z';
{const d=buf.getChannelData(0),n=[220,262,330,392,330,262,196,247];for(let i=0;i<d.length;i++){const t=i/R,s=t%.25,k=t%.5;
d[i]=.3*Math.sin(6.283*n[t*4|0]*t)*Math.exp(-9*s)+.5*Math.sin(6.283*(50*k+3*(1-Math.exp(-40*k))))*Math.exp(-8*k)}}
const ir=A.createBuffer(2,R*3,R);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)**4}
const cr=new Float32Array(4096).map((_,i)=>Math.round((i/2048-1)*6)/6);
const ws=A.createWaveShaper(),bq=A.createBiquadFilter(),dl=A.createDelay(2),fb=A.createGain(),ds=A.createGain(),rv=A.createConvolver(),rs=A.createGain();
rv.buffer=ir;dl.delayTime.value=.375;fb.gain.value=.45;N(ws,bq,A.destination);N(bq,ds,dl,fb,dl,A.destination);N(bq,rs,rv,A.destination);
const FX={z:[0,'lowpass',2e4,0,0],x:[0,'lowpass',600,0,0],c:[0,'highpass',1500,0,0],v:[0,'lowpass',2e4,.6,0],b:[0,'lowpass',2e4,0,.8],n:[1,'lowpass',2e4,0,0],m:[1,'bandpass',1200,.6,.8]};
function apply(){const [c,ty,fr,d,r]=FX[fx],L=buf.duration/2**len,p0=pos*buf.duration/10;ws.curve=c?cr:null;bq.type=ty;bq.frequency.value=fr;bq.Q.value=ty=='bandpass'?3:1;
ds.gain.value=d;rs.gain.value=r;if(src){src.loopStart=p0;src.loopEnd=Math.min(buf.duration,p0+L);src.playbackRate.value=2**(pit/12)}
s.textContent=(on?'▶ ':'■ ')+'len '+['1','½','¼','⅛','1/16','1/32'][len]+' · start '+pos+'/10 · '+(pit>0?'+':'')+pit+' · '+fx}
function play(){if(src)src.stop();src=null;if(on){src=A.createBufferSource();src.buffer=buf;src.loop=true;src.connect(ws);apply();src.start(0,src.loopStart)}apply()}
onkeydown=e=>{const k=e.key.toLowerCase(),i='qwertyuiop'.indexOf(k),j='asdfghjkl'.indexOf(k);A.resume();
if(e.code=='Space'){e.preventDefault();on^=1;return play()}if(k=='enter')return f.click();
if(k>='1'&&k<='6')len=k-1;else if(i>=0)pos=i;else if(j>=0)pit=[-12,-7,-5,-2,0,3,5,7,12][j];else if(FX[k])fx=k;else return;apply()};
async function load(file){const b=await file.arrayBuffer();try{buf=await A.decodeAudioData(b.slice(0))}catch(e){buf=aiff(b)}A.resume();on=1;play()}
function aiff(b){const v=new DataView(b);let p=12,c,n,w,r,o;while(p+8<=v.byteLength){const id=String.fromCharCode(...new Uint8Array(b,p,4)),z=v.getUint32(p+4);
if(id=="COMM"){c=v.getInt16(p+8);n=v.getUint32(p+10);w=v.getInt16(p+14)/8;r=v.getUint32(p+18)*2**((v.getUint16(p+16)&32767)-16414)}if(id=="SSND")o=p+16+v.getUint32(p+8);p+=8+z+(z&1)}
const B=A.createBuffer(c,n,r);for(let k=0;k<c;k++){const d=B.getChannelData(k);for(let i=0;i<n;i++){const q=o+(i*c+k)*w;d[i]=w==1?v.getInt8(q)/128:w==2?v.getInt16(q)/32768:w==3?(v.getInt8(q)*65536+v.getUint16(q+1))/8388608:v.getInt32(q)/2147483648}}return B}
ondragover=e=>e.preventDefault();ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};f.onchange=()=>load(f.files[0]);
</script>
